; エビデンスサポートツール 設定ファイル

[Targets]
; 監視対象となるログファイル/フォルダを定義します。
; ここで定義したキー（=の左側）が、エビデンス保存時のフォルダ名になります。
;
; パスには以下の特殊な日付・時刻フォーマットを使用できます。
;   *        : ファイル名のワイルドカード
;   {YYYY}   : 4桁の年 (例: 2025)
;   {MM}     : 2桁の月 (例: 10)
;   {DD}     : 2桁の日 (例: 16)
;
; 例:
; AppLog = C:\App\Logs\{YYYY}{MM}{DD}\application_*.log
; SystemLog = C:\Windows\System32\winevt\Logs\System.evtx

WebAppLog = test\test1\{DD}\新しい.log
DatabaseLog = test\test2\*.log


[CollectTargets]
; 差分抽出ではなく、ファイルをそのままコピーして収集するターゲットを定義します。
; キー（=の左側）がエビデンス保存時の evidence/collect/ 直下のサブフォルダ名になります。
; パスには [Targets] と同様のプレースホルダー（{YYYY}, {MM}, {DD}, *）が使用できます。
;
; 例:
; IisLog   = C:\inetpub\logs\LogFiles\W3SVC1\{YYYY}{MM}{DD}\*.log
; EventLog = C:\Windows\System32\winevt\Logs\Application.evtx


[Settings]
; ツールの動作全般に関する設定です。

; EvidenceSavePath: 抽出したエビデンスを保存する親フォルダのパス
EvidenceSavePath = .\test

; KeepSnapshot: 監視停止時に、比較元として使用したログのスナップショットを保持するかどうか
; true  = 保持する
; false = 削除する
KeepSnapshot = false

; AutoSaveScreenshots: 監視中にクリップボードに画像がコピーされた際、自動的に保存するかどうか
; true  = 保存する
; false = 保存しない
AutoSaveScreenshots = true
